<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The status page's link preview (og:image): docs/header.svg's mark and
       words in its dark colours, at 1200x630, the usual Open Graph image size.
       Rendered to docs/social-card.png by scripts/social-card.sh. -->
  <defs>
    <g id="arm"><path d="M50 43 V12"/><path d="M43.5 19 L50 25.5 L56.5 19"/></g>
  </defs>
  <rect width="1200" height="630" fill="#1b2028"/>

  <svg x="80" y="130" width="370" height="370" viewBox="30 40 140 140">
    <g fill="none" stroke="#7fa6e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(100 110) rotate(60) scale(1.25) translate(-50 -50)">
      <use href="#arm"/><use href="#arm" transform="rotate(60 50 50)"/><use href="#arm" transform="rotate(120 50 50)"/>
      <use href="#arm" transform="rotate(180 50 50)"/><use href="#arm" transform="rotate(240 50 50)"/><use href="#arm" transform="rotate(300 50 50)"/>
    </g>
    <g transform="translate(100 110) scale(1.25) translate(-50 -50)">
      <path d="M62 6 L35 53 H50 L40 94 L68 44 H53 Z" fill="#ffd23f" stroke="#1b2028" stroke-width="6.4" stroke-linejoin="round" paint-order="stroke" transform="translate(51 50) scale(.78) translate(-51 -50)"/>
    </g>
  </svg>

  <g font-family="IBM Plex Sans">
    <text x="510" y="290" font-size="96" font-weight="700" letter-spacing="-2" fill="#e3eaf7">t3code<tspan fill="#a9c4f2">-nix</tspan></text>
    <text x="514" y="360" font-size="40" font-weight="500" fill="#e3eaf7">Package status</text>
  </g>
  <g font-family="IBM Plex Mono" font-size="25" fill="#9aa3b0">
    <text x="515" y="425">T3 Code and all agent providers,</text>
    <text x="515" y="461">packaged for Nix within minutes</text>
  </g>
</svg>
